name: One-shot Firebase popup navigation repair

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: write

concurrency:
  group: nexus-one-shot-firebase-popup-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Development revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
      - name: Patch, regression-test, self-delete, and push
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'main.js';
          const source = fs.readFileSync(file, 'utf8');
          const before = "if (url !== pathToFileURL(path.join(__dirname, 'index.html')).href) event.preventDefault();";
          const after = "const nexusAppUrl = pathToFileURL(path.join(__dirname, 'index.html')).href;\n        if (url === nexusAppUrl || isAllowedPopupUrl(url)) return;\n        event.preventDefault();";
          const count = source.split(before).length - 1;
          if (count !== 1) {
            console.error(`Expected exactly one popup navigation guard statement, found ${count}; refusing an ambiguous repair.`);
            process.exit(1);
          }
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          rm .github/workflows/one-shot-firebase-popup-fix.yml
          node --check main.js
          node --test test/firebasePopupRegression.test.js
          git fetch origin Development-branch
          current="$(git rev-parse origin/Development-branch)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Development advanced from $GITHUB_SHA to $current; refusing stale write."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/one-shot-firebase-popup-fix.yml
          git commit -m "Fix Firebase auth popup navigation"
          git push origin HEAD:Development-branch
