name: One-shot Firebase popup navigation repair

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: write

concurrency:
  group: nexus-one-shot-firebase-popup-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Development revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply narrow popup navigation repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'main.js';
          const source = fs.readFileSync(path, 'utf8');
          const before = `    if (contents.getType() === 'window') {
              contents.on('will-navigate', (event, url) => {
                if (url !== pathToFileURL(path.join(__dirname, 'index.html')).href) event.preventDefault();
              });
            }
          `;
          const after = `    if (contents.getType() === 'window') {
              contents.on('will-navigate', (event, url) => {
                const nexusAppUrl = pathToFileURL(path.join(__dirname, 'index.html')).href;
                if (url === nexusAppUrl || isAllowedPopupUrl(url)) return;
                event.preventDefault();
              });
            }
          `;
          if (!source.includes(before)) {
            console.error('Expected popup navigation guard was not found; refusing an ambiguous repair.');
            process.exit(1);
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          rm .github/workflows/one-shot-firebase-popup-fix.yml
          node scripts/selfRepairCommit.js --apply --no-report
          node --check main.js
          node --test test/firebasePopupRegression.test.js
          npm run inventory:verify
      - name: Push repaired Development state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Development-branch
          current="$(git rev-parse origin/Development-branch)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Development advanced from $GITHUB_SHA to $current; refusing stale write. A fresh run will handle the new head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js repository-file-manifest.json .github/workflows/one-shot-firebase-popup-fix.yml
          if git diff --cached --quiet; then
            echo "No repair changes remain."
            exit 0
          fi
          git commit -m "Fix Firebase auth popup navigation"
          git push origin HEAD:Development-branch
