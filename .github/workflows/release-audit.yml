name: Nexus Full Release Audit

on:
  pull_request:
  push:
    branches:
      - Development-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-tests:
    # OS/Node-independent checks (privacy, syntax, architecture, inventory)
    # used to run identically on all 9 combinations below - 36 redundant
    # runs per trigger for checks that can't vary by platform. They now run
    # once in dependency-and-release-audit; this matrix only keeps what
    # actually needs OS/Node coverage: the test suite itself.
    name: Tests ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test

  dependency-and-release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run privacy:retry
      - run: node scripts/checkSyntax.js
      - run: node scripts/verifyArchitecture.js
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/releaseAudit.js
      - run: npm run inventory:verify

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx electron-builder --win nsis --publish never
      - run: npm run inventory:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-overhaul-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
