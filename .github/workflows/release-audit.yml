name: Nexus Full Release Audit

on:
  pull_request:
  push:
    branches:
      - upgrade/nexus-overhaul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-tests:
    name: Tests ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/checkSyntax.js
      - run: node scripts/verifyArchitecture.js
      - run: node --test

  dependency-and-release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/releaseAudit.js

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-overhaul-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
