name: Promote tested development to main

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: write

concurrency:
  group: nexus-main-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Development-branch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for deterministic remediation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair, retry, and promote the exact development commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promoteTestedDevelopment.js
