name: Promote tested development to main

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: write

concurrency:
  group: nexus-main-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: Development-branch
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for deterministic remediation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair, retry, and promote the exact development commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promoteTestedDevelopment.js
