name: One-shot inventory refresh

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: write

concurrency:
  group: nexus-one-shot-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Development revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refresh reviewed repository inventory and self-delete
        shell: bash
        run: |
          set -euo pipefail
          npm run inventory:update
          rm .github/workflows/one-shot-inventory-refresh.yml
          npm run inventory:update
          npm run inventory:verify
          git fetch origin Development-branch
          current="$(git rev-parse origin/Development-branch)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Development advanced from $GITHUB_SHA to $current; refusing stale write."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-file-manifest.json .github/workflows/one-shot-inventory-refresh.yml
          git commit -m "Refresh repository inventory after Firebase popup repair"
          git push origin HEAD:Development-branch
