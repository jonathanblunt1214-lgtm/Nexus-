name: One-shot inventory refresh

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Development-branch
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot workflow and regenerate final inventory
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-inventory-refresh.yml
          npm run inventory:update
          npm run inventory:verify
      - name: Commit refreshed inventory only on the exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Development-branch
          remote_head="$(git rev-parse origin/Development-branch)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Development advanced from $GITHUB_SHA to $remote_head; refusing stale inventory write."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-file-manifest.json .github/workflows/one-shot-inventory-refresh.yml
          git commit -m "Refresh repository inventory"
          git push origin HEAD:Development-branch
