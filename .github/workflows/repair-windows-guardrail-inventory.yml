name: Refresh inventory for Windows guardrail fix

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fix before inventory refresh
        run: |
          node scripts/checkSyntax.js
          node --test test/aiGuardrailCompliance.test.js
      - name: Remove one-shot workflow and refresh inventory
        run: |
          rm -f .github/workflows/repair-windows-guardrail-inventory.yml
          npm run inventory:update
          npm run inventory:verify
          npm run repository:clutter
      - name: Commit repaired inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh inventory for Windows guardrail fix"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:Development-branch
