name: Retired AI source cleanup

on:
  push:
    branches:
      - Development-branch
    paths:
      - scripts/removeRetiredAiSettings.js
      - .github/workflows/retired-ai-source-cleanup.yml

permissions:
  contents: write

concurrency:
  group: nexus-retired-ai-source-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Development-branch
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove retired AI settings source
        run: node scripts/removeRetiredAiSettings.js
      - name: Remove one-time cleanup machinery
        run: rm scripts/removeRetiredAiSettings.js .github/workflows/retired-ai-source-cleanup.yml
      - name: Refresh repository inventory
        run: node scripts/verifyRepositoryInventory.js --write
      - name: Verify targeted regression tests
        run: node --test test/codingModelProviders.test.js
      - name: Commit grep-clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js preload.js renderer.js index.html bootstrap.js test/codingModelProviders.test.js repository-file-manifest.json scripts/removeRetiredAiSettings.js .github/workflows/retired-ai-source-cleanup.yml
          git diff --cached --check
          git commit -m "Remove retired Gemini and OpenAI settings source"
          git push origin HEAD:Development-branch
