name: Publish Nexus Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_ref:
        description: Version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release
        shell: pwsh
        run: |
          npm test
          npm run audit:release
          npm run audit:architecture
          npm run inventory:verify

      - name: The Crucible
        run: npm run release:crucible

      - name: Confirm tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $releaseRef = "${{ inputs.release_ref || github.ref_name }}"
          if ("v$packageVersion" -ne $releaseRef) {
            throw "Tag $releaseRef does not match package version v$packageVersion"
          }

      - name: Build and publish updater artifacts
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
