name: Publish Nexus Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_ref:
        description: Version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Separate steps on purpose. GitHub's pwsh wrapper appends
      # `exit $LASTEXITCODE`, and $ErrorActionPreference='stop' does not halt on
      # a NATIVE command's non-zero exit, only on PowerShell cmdlet errors. In a
      # single multi-line block only the last command's status reached the step,
      # so a failing test, release audit or architecture audit was swallowed and
      # the release published anyway.
      - name: Run tests
        run: npm test

      - name: Audit release
        run: npm run audit:release

      - name: Audit architecture
        run: npm run audit:architecture

      - name: Verify repository inventory
        run: npm run inventory:verify

      - name: The Crucible
        run: npm run release:crucible

      - name: Confirm tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $releaseRef = "${{ inputs.release_ref || github.ref_name }}"
          if ("v$packageVersion" -ne $releaseRef) {
            throw "Tag $releaseRef does not match package version v$packageVersion"
          }

      - name: Build and publish updater artifacts
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
