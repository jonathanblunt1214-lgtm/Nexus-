name: The Crucible

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * 0'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  crucible:
    name: The Crucible
    uses: jonathanblunt1214-lgtm/The-Crucible/.github/workflows/the-crucible.yml@2937265c232f103963f4d5decf126e839a00bcaa
    with:
      core_ref: 2937265c232f103963f4d5decf126e839a00bcaa
      config_path: .thecrucible.json
      run_workload: ${{ github.event_name != 'schedule' || github.event.schedule == '47 4 * * 0' }}
      weekly_maintenance: ${{ github.event.schedule == '47 4 * * 0' }}
      # dependency_review only ever runs when github.event_name == 'pull_request',
      # which this workflow no longer triggers on (see the "on:" block above).
      # Left false rather than true to not claim coverage that can't fire.
      dependency_review: false
