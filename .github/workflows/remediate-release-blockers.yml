name: Nexus Release Blocker Remediation

on:
  push:
    branches:
      - upgrade/nexus-overhaul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/nexus-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch bridge and persistence
        run: node scripts/remediateReleaseBlockers.js
      - name: Regenerate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run syntax, architecture, tests, and release audit
        run: |
          node scripts/checkSyntax.js
          node scripts/verifyArchitecture.js
          node --test
          npm audit --omit=dev --audit-level=high
          node scripts/releaseAudit.js
      - name: Commit generated release fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preload.js main.js package-lock.json
          if git diff --cached --quiet; then
            echo "No generated remediation changes to commit."
          else
            git commit -m "Release hardening: finalize bridge, lockfile, and atomic persistence"
            git push origin HEAD:upgrade/nexus-overhaul
          fi
