name: Nexus Branch Integrity

on:
  push:
    branches:
      - main
      - Development-branch
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce development-first branch flow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main Development-branch
          main_sha="$(git rev-parse origin/main)"
          development_sha="$(git rev-parse origin/Development-branch)"
          if git merge-base --is-ancestor "$main_sha" "$development_sha"; then
            echo "Branch flow is valid: main is the same as, or behind, Development-branch."
            exit 0
          fi

          # Squash promotion deliberately gives main a new commit identity. In
          # that case, require its complete tree to match a tree that actually
          # existed in Development history; a main-only change cannot pass.
          main_tree="$(git rev-parse "${main_sha}^{tree}")"
          while read -r development_commit; do
            if [ "$(git rev-parse "${development_commit}^{tree}")" = "$main_tree" ]; then
              echo "Branch flow is valid: main exactly matches promoted Development tree ${development_commit}."
              exit 0
            fi
          done < <(git rev-list "$development_sha")

          echo "::error::main contains a tree that never existed in Development-branch."
          exit 1
