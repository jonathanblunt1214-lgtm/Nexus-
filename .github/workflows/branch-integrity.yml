name: Nexus Branch Integrity

on:
  push:
    branches:
      - main
      - Development-branch
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce development-first branch flow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main Development-branch
          main_sha="$(git rev-parse origin/main)"
          development_sha="$(git rev-parse origin/Development-branch)"
          if ! git merge-base --is-ancestor "$main_sha" "$development_sha"; then
            echo "::error::main contains work that was not promoted from Development-branch, or the branches diverged."
            exit 1
          fi
          echo "Branch flow is valid: main is the same as, or behind, Development-branch."
