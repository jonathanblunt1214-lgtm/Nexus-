name: One-shot inventory refresh

on:
  push:
    branches:
      - codex/add-the-crucible

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'jonathanblunt1214-lgtm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/add-the-crucible
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refresh repository inventory and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-inventory-after-maintenance-fix.yml
          npm run inventory:update
          git add repository-file-manifest.json
          git commit -m "Refresh inventory after maintenance hardening"
          git push origin HEAD:codex/add-the-crucible
