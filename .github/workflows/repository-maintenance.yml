name: Nexus Repository Maintenance

on:
  pull_request:
    branches:
      - main
      - Development-branch

permissions:
  contents: read

jobs:
  daily-clutter-audit:
    name: Daily clutter audit · ${{ matrix.ref }}
    strategy:
      fail-fast: false
      matrix:
        ref: [main, Development-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run repository:clutter
      - run: npm run inventory:verify
      - run: npm run privacy:verify

  weekly-git-maintenance:
    name: Weekly safe Git repack · ${{ matrix.ref }}
    strategy:
      fail-fast: false
      matrix:
        ref: [main, Development-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run repository:maintain
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run release:crucible
