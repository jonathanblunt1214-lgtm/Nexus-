name: Nexus Repository Maintenance

on:
  pull_request:
    branches:
      - main
      - Development-branch
  workflow_dispatch:
    inputs:
      run_weekly_maintenance:
        description: Run safe Git object repacking and The Crucible
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * 0'

permissions:
  contents: read

jobs:
  daily-clutter-audit:
    name: Daily clutter audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: ''
      - run: npm run repository:clutter
      - run: npm run inventory:verify
      - run: npm run privacy:verify

  weekly-git-maintenance:
    name: Weekly safe Git repack · main
    if: github.event.schedule == '47 4 * * 0' || inputs.run_weekly_maintenance == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: ''
      - run: npm run repository:maintain
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run release:crucible
