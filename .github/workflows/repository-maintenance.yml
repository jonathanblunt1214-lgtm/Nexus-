name: Nexus Repository Maintenance

on:
  workflow_dispatch:
    inputs:
      run_weekly_maintenance:
        description: Run safe Git object repacking and The Crucible
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 4 * * 0'

permissions:
  contents: read

jobs:
  daily-clutter-audit:
    name: Daily clutter audit · ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, Development-branch]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run repository:clutter
      - run: npm run inventory:verify
      - run: npm run privacy:verify

  weekly-git-maintenance:
    name: Weekly safe Git repack · ${{ matrix.ref }}
    if: github.event.schedule == '47 4 * * 0' || inputs.run_weekly_maintenance == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        ref: [main, Development-branch]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run repository:maintain
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run release:crucible
