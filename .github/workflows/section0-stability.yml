name: Nexus Crucible

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - Development-branch

permissions:
  contents: read

jobs:
  verify:
    name: The Crucible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run release:crucible
