name: Nexus Stability Gate

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/nexus-overhaul

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: node scripts/verifyArchitecture.js
      - run: node --test
