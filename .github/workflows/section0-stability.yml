name: Nexus Stability Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - upgrade/nexus-overhaul

jobs:
  verify:
    name: Unified heavy release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run release:stress
