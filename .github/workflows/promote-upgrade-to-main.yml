name: Promote tested upgrade to main

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: write

concurrency:
  group: nexus-main-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/nexus-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for deterministic remediation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair, retry, and promote the exact upgrade commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promoteTestedUpgrade.js
