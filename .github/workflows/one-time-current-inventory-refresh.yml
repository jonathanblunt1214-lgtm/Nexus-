name: One-time verified current inventory refresh

on:
  push:
    branches:
      - Development-branch
    paths:
      - .github/workflows/one-time-current-inventory-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out current Development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: Development-branch
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repaired workload checks
        run: |
          node --test test/branchSyncWorkflow.test.js test/officialLanguageServers.test.js
          node scripts/verifyArchitecture.js

      - name: Remove one-time workflow and refresh inventory
        run: |
          rm .github/workflows/one-time-current-inventory-refresh.yml
          npm run inventory:update
          npm run inventory:verify

      - name: Commit exact verified Development state
        run: |
          set -euo pipefail
          git fetch origin Development-branch
          current="$(git rev-parse origin/Development-branch)"
          local_head="$(git rev-parse HEAD)"
          if [ "$current" != "$local_head" ]; then
            echo "Development advanced from $local_head to $current; refusing stale inventory commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh inventory after Crucible workload repairs"
          git push origin HEAD:Development-branch
