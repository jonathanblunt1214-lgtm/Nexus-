name: Project opening end-to-end verification

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: read

jobs:
  project-opening-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies without repository lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if [ ! -x node_modules/electron/dist/electron ]; then
            node node_modules/electron/install.js || node node_modules/electron/install.js
          fi
      - name: Drive real Electron project-opening flow
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/nexus-react-project"
          mkdir -p "$FIXTURE"
          cat > "$FIXTURE/package.json" <<'JSON'
          {
            "name": "nexus-e2e-react-fixture",
            "private": true,
            "scripts": { "dev": "vite" },
            "dependencies": { "react": "^19.0.0", "react-dom": "^19.0.0" },
            "devDependencies": { "vite": "^7.0.0" }
          }
          JSON
          cat > "$FIXTURE/index.html" <<'HTML'
          <!doctype html><html><body><div id="root"></div></body></html>
          HTML
          cat > .project-opening-e2e.mjs <<'NODE'
          import { _electron as electron } from 'playwright-core';
          import path from 'node:path';
          import process from 'node:process';

          const appDir = process.cwd();
          const fixture = process.env.FIXTURE;
          const electronBin = path.join(appDir, 'node_modules/electron/dist/electron');

          async function launch() {
            const app = await electron.launch({
              executablePath: electronBin,
              args: ['--no-sandbox', appDir],
              env: { ...process.env },
              timeout: 30000,
            });
            const page = await app.firstWindow();
            await page.waitForLoadState('domcontentloaded');
            await page.waitForTimeout(2000);
            return { app, page };
          }

          const first = await launch();
          try {
            const result = await first.page.evaluate(async (fixturePath) => {
              const name = document.getElementById('project-name');
              const folder = document.getElementById('project-path');
              const command = document.getElementById('project-command');
              const port = document.getElementById('project-port');
              if (!name || !folder || !command || !port) throw new Error('Add Project form is missing required controls');

              port.value = '123456';
              port.dispatchEvent(new Event('input', { bubbles: true }));
              if (port.value !== '12345') throw new Error(`Port cap failed: ${port.value}`);

              name.value = 'React Fixture Project';
              folder.value = fixturePath;
              command.value = 'npm run dev';
              port.value = '';

              const metadata = await detectAndFillProjectMetadata(fixturePath);
              const appRadio = document.querySelector('input[name="new-project-template"][value="app"]');
              if (!metadata?.detectedType || metadata.detectedType.templateId !== 'app') {
                throw new Error(`React type detection failed: ${JSON.stringify(metadata)}`);
              }
              if (!appRadio?.checked) throw new Error('React project type was not selected in the form');

              await addProject({ preventDefault() {} });
              const saved = JSON.parse(localStorage.getItem('nexus_projects') || '[]');
              const project = saved.find((entry) => entry.folder === fixturePath);
              if (!project) throw new Error('Project was not saved after Add Project flow');
              if (project.templateId !== 'app') throw new Error(`Saved project type is ${project.templateId || 'missing'}, expected app`);
              if (!document.getElementById('project-list')?.innerText.includes('React Fixture Project')) {
                throw new Error('Saved project is not rendered in the project list');
              }
              return { project, metadata, portCap: '12345' };
            }, fixture);
            console.log('FIRST-LAUNCH-PASS', JSON.stringify(result));
          } finally {
            await first.app.close();
          }

          const second = await launch();
          try {
            const persisted = await second.page.evaluate((fixturePath) => {
              const saved = JSON.parse(localStorage.getItem('nexus_projects') || '[]');
              const project = saved.find((entry) => entry.folder === fixturePath);
              if (!project) throw new Error('Saved project did not survive an actual Nexus relaunch');
              const listText = document.getElementById('project-list')?.innerText || '';
              if (!listText.includes('React Fixture Project')) throw new Error('Persisted project is not visible after relaunch');
              return { name: project.name, folder: project.folder, templateId: project.templateId, visible: true };
            }, fixture);
            console.log('RELAUNCH-PASS', JSON.stringify(persisted));
          } finally {
            await second.app.close();
          }
          NODE
          trap 'rm -f .project-opening-e2e.mjs' EXIT
          FIXTURE="$FIXTURE" xvfb-run -a node .project-opening-e2e.mjs
      - name: Verify repository gates relevant to project opening
        run: |
          node scripts/checkSyntax.js
          node scripts/verifyArchitecture.js
          npm test
          npm run privacy:verify
