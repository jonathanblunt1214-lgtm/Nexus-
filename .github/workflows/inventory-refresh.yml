name: One-time Repository Inventory Refresh

on:
  push:
    branches:
      - Development-branch
    paths:
      - '.github/workflows/inventory-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Development
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: Development-branch
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Remove one-time workflow and refresh inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inventory-refresh.yml
          npm run inventory:update
          npm run inventory:verify
          git add repository-file-manifest.json
          git commit -m "Refresh repository inventory after clutter cleanup"
          git push origin HEAD:Development-branch
