name: Resume project type detection pipeline

on:
  push:
    branches:
      - Development-branch

permissions:
  contents: write

jobs:
  finish-project-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Finish port cap and project type auto-detection
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, before, after) {
            const original = fs.readFileSync(file, 'utf8');
            if (!original.includes(before)) throw new Error(`${file}: expected text not found`);
            const updated = original.replace(before, after);
            fs.writeFileSync(file, updated);
          }

          const detector = `const fs = require('fs');
          const path = require('path');

          function readPackage(folder) {
            try { return JSON.parse(fs.readFileSync(path.join(folder, 'package.json'), 'utf8')); }
            catch { return null; }
          }

          function hasFile(folder, names) {
            return names.some((name) => fs.existsSync(path.join(folder, name)));
          }

          function detectProjectType(folder) {
            const pkg = readPackage(folder);
            const dependencies = { ...(pkg?.dependencies || {}), ...(pkg?.devDependencies || {}) };
            const hasAnyDependency = (...names) => names.some((name) => Boolean(dependencies[name]));

            const apiFramework = hasAnyDependency('express', 'fastify', 'koa', '@nestjs/core', '@hapi/hapi', 'hono');
            const interactiveApp = hasAnyDependency('react', 'react-dom', 'vue', 'svelte', '@angular/core', 'electron', 'react-native');
            const websiteFramework = hasAnyDependency('next', 'astro', 'gatsby', '@11ty/eleventy');
            const apiFiles = hasFile(folder, ['server.js', 'server.ts', 'app.js', 'app.ts']) || hasFile(folder, ['routes', 'controllers']);
            const websiteFiles = hasFile(folder, ['index.html', 'public/index.html']);

            if (apiFramework && !interactiveApp && !websiteFramework) {
              return { templateId: 'api', source: 'server framework dependencies' };
            }
            if (interactiveApp) {
              return { templateId: 'app', source: 'interactive application dependencies' };
            }
            if (websiteFramework) {
              return { templateId: 'website', source: 'website framework dependencies' };
            }
            if (apiFiles && !websiteFiles) {
              return { templateId: 'api', source: 'server entry files' };
            }
            if (websiteFiles || hasAnyDependency('vite')) {
              return { templateId: 'website', source: websiteFiles ? 'web entry file' : 'Vite project' };
            }
            return { templateId: 'website', source: 'default project type' };
          }

          module.exports = { detectProjectType };
          `;
          fs.writeFileSync('projectTypeDetector.js', detector);

          replaceOnce(
            'index.html',
            '<input type="text" id="project-path" placeholder="Real folder path, or paste a GitHub URL to clone it" onblur="detectAndFillProjectPort()">',
            '<input type="text" id="project-path" placeholder="Real folder path, or paste a GitHub URL to clone it" onblur="detectAndFillProjectMetadata()">'
          );
          replaceOnce(
            'index.html',
            '<input type="number" id="project-port" min="1" max="65535" step="1" inputmode="numeric" aria-label="Project port" placeholder="Port (auto)" title="Enter a port from 1 to 65535, or leave blank to auto-detect" style="max-width:160px; min-width:130px;">',
            '<input type="number" id="project-port" min="1" max="65535" step="1" inputmode="numeric" maxlength="5" oninput="if (this.value.length > 5) this.value = this.value.slice(0, 5)" aria-label="Project port" placeholder="Port (auto)" title="Enter a port from 1 to 65535, or leave blank to auto-detect" style="max-width:160px; min-width:130px;">'
          );

          replaceOnce(
            'preload.js',
            "  detectProjectPort: (folder) => ipcRenderer.invoke('detect-project-port', { folder }),",
            "  detectProjectPort: (folder) => ipcRenderer.invoke('detect-project-port', { folder }),\n  detectProjectType: (folder) => ipcRenderer.invoke('detect-project-type', { folder }),"
          );

          replaceOnce(
            'main.js',
            "const { resolveProjectPath, isGitUrl, detectProjectPort } = require('./projectCloner');",
            "const { resolveProjectPath, isGitUrl, detectProjectPort } = require('./projectCloner');\nconst { detectProjectType } = require('./projectTypeDetector');"
          );

          const mainText = fs.readFileSync('main.js', 'utf8');
          const portHandler = /ipcMain\.handle\('detect-project-port',[\s\S]*?\n\}\);/;
          const portMatch = mainText.match(portHandler);
          if (!portMatch) throw new Error('main.js: detect-project-port handler not found');
          const typeHandler = `\n\nipcMain.handle('detect-project-type', (_event, { folder }) => {\n  try {\n    if (!folder || isGitUrl(folder)) return { ok:false, error:'Choose or enter a local project folder first.' };\n    const resolved = path.resolve(folder);\n    if (!fs.existsSync(resolved) || !fs.statSync(resolved).isDirectory()) return { ok:false, error:'The project folder does not exist.' };\n    return { ok:true, detectedType:detectProjectType(resolved) };\n  } catch (err) {\n    return { ok:false, error:err.message };\n  }\n});`;
          fs.writeFileSync('main.js', mainText.replace(portHandler, `${portMatch[0]}${typeHandler}`));

          const rendererText = fs.readFileSync('renderer.js', 'utf8');
          const portFunction = /async function detectAndFillProjectPort\([\s\S]*?\n\}/;
          const portFnMatch = rendererText.match(portFunction);
          if (!portFnMatch) throw new Error('renderer.js: detectAndFillProjectPort not found');
          const metadataFunctions = `${portFnMatch[0]}\n\nasync function detectAndSelectProjectType(folder = document.getElementById('project-path').value.trim()) {\n  if (!folder) return null;\n  const result = await window.nexus.detectProjectType(folder);\n  const templateId = result?.detectedType?.templateId;\n  if (!result?.ok || !['website', 'app', 'api'].includes(templateId)) return null;\n  const radio = document.querySelector(\`input[name="new-project-template"][value="\${templateId}"]\`);\n  if (radio) radio.checked = true;\n  selectProjectTemplate(templateId);\n  return result.detectedType;\n}\n\nasync function detectAndFillProjectMetadata(folder = document.getElementById('project-path').value.trim()) {\n  if (!folder) return { detectedPort:null, detectedType:null };\n  const [detectedPort, detectedType] = await Promise.all([\n    detectAndFillProjectPort(folder),\n    detectAndSelectProjectType(folder),\n  ]);\n  return { detectedPort, detectedType };\n}`;
          let updatedRenderer = rendererText.replace(portFunction, metadataFunctions);

          const projectCreation = "  const project = { id: Date.now(), name, folder, command, port, running: false };";
          if (!updatedRenderer.includes(projectCreation)) throw new Error('renderer.js: project creation line not found');
          updatedRenderer = updatedRenderer.replace(
            projectCreation,
            "  const detectedTypeResult = await window.nexus.detectProjectType(folder);\n  const templateId = detectedTypeResult?.ok && ['website', 'app', 'api'].includes(detectedTypeResult.detectedType?.templateId)\n    ? detectedTypeResult.detectedType.templateId\n    : undefined;\n  if (templateId) {\n    const radio = document.querySelector(`input[name=\"new-project-template\"][value=\"${templateId}\"]`);\n    if (radio) radio.checked = true;\n    selectProjectTemplate(templateId);\n  }\n\n  const project = { id: Date.now(), name, folder, command, port, templateId, running: false };"
          );
          fs.writeFileSync('renderer.js', updatedRenderer);

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!packageJson.build.files.includes('projectTypeDetector.js')) {
            const index = packageJson.build.files.indexOf('projectPortDetector.js');
            packageJson.build.files.splice(index >= 0 ? index + 1 : packageJson.build.files.length, 0, 'projectTypeDetector.js');
            fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          }

          const detectorTest = `const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { detectProjectType } = require('../projectTypeDetector');

          function fixture(files = {}) {
            const folder = fs.mkdtempSync(path.join(os.tmpdir(), 'nexus-project-type-'));
            for (const [name, content] of Object.entries(files)) {
              const target = path.join(folder, name);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.writeFileSync(target, content);
            }
            return folder;
          }

          test('detects React projects as app projects', (t) => {
            const folder = fixture({ 'package.json': JSON.stringify({ dependencies: { react: '^19.0.0', 'react-dom': '^19.0.0' } }) });
            t.after(() => fs.rmSync(folder, { recursive: true, force: true }));
            assert.deepEqual(detectProjectType(folder), { templateId: 'app', source: 'interactive application dependencies' });
          });

          test('detects server-only Express projects as API projects', (t) => {
            const folder = fixture({ 'package.json': JSON.stringify({ dependencies: { express: '^5.0.0' } }) });
            t.after(() => fs.rmSync(folder, { recursive: true, force: true }));
            assert.deepEqual(detectProjectType(folder), { templateId: 'api', source: 'server framework dependencies' });
          });

          test('detects Next projects as websites when no interactive framework dependency is declared', (t) => {
            const folder = fixture({ 'package.json': JSON.stringify({ dependencies: { next: '^15.0.0' } }) });
            t.after(() => fs.rmSync(folder, { recursive: true, force: true }));
            assert.deepEqual(detectProjectType(folder), { templateId: 'website', source: 'website framework dependencies' });
          });

          test('detects plain index.html projects as websites', (t) => {
            const folder = fixture({ 'index.html': '<!doctype html><title>fixture</title>' });
            t.after(() => fs.rmSync(folder, { recursive: true, force: true }));
            assert.deepEqual(detectProjectType(folder), { templateId: 'website', source: 'web entry file' });
          });

          test('falls back to website for an otherwise unknown folder', (t) => {
            const folder = fixture();
            t.after(() => fs.rmSync(folder, { recursive: true, force: true }));
            assert.deepEqual(detectProjectType(folder), { templateId: 'website', source: 'default project type' });
          });
          `;
          fs.writeFileSync('test/projectTypeDetector.test.js', detectorTest);

          const formTest = fs.readFileSync('test/projectPortForm.test.js', 'utf8');
          const additions = `\n  assert.match(html, /id="project-path"[^>]*onblur="detectAndFillProjectMetadata\\(\\)"/);\n  assert.match(html, /id="project-port"[^>]*maxlength="5"[^>]*oninput=/);\n  assert.match(renderer, /async function detectAndSelectProjectType/);\n  assert.match(renderer, /async function detectAndFillProjectMetadata/);\n  assert.match(renderer, /detectProjectType\\(folder\\)/);\n  assert.match(renderer, /templateId, running: false/);\n  assert.match(preload, /detectProjectType:.*detect-project-type/);\n  assert.match(main, /ipcMain\\.handle\\('detect-project-type'/);`;
          if (!formTest.includes("detect-project-type")) {
            fs.writeFileSync('test/projectPortForm.test.js', formTest.replace(/\n\}\);\s*$/, `${additions}\n});\n`));
          }
          NODE
      - name: Verify the completed pipeline
        run: |
          node scripts/checkSyntax.js
          node scripts/verifyArchitecture.js
          npm test
          npm run privacy:verify
      - name: Remove one-shot workflow and refresh inventory
        run: |
          rm -f .github/workflows/continue-project-type-pipeline.yml
          npm run inventory:update
          npm run inventory:verify
          npm run repository:clutter
      - name: Commit verified changes back to Development-branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish project type auto-detection and port input cap"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:Development-branch
